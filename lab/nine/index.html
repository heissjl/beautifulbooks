<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 9 books that made me — lab</title>
<style>
  :root { --bg: #f4f0e8; --ink: #1f1b18; --ink2: #746c62; --line: #d8d0c4; --accent: #945138; --empty: #e6dfd3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  h1 { font: italic 28px/1.15 Georgia, serif; margin: 8px 0 4px; }
  .sub { color: var(--ink2); margin: 0 0 16px; }
  .grid { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .slot { aspect-ratio: 2 / 3; background: var(--empty); border: 0; padding: 0; position: relative; cursor: pointer; color: var(--ink2); font-size: 28px; }
  .slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot.target { outline: 3px solid var(--accent); outline-offset: 2px; }
  .slot .n { position: absolute; left: 6px; top: 4px; font-size: 12px; }
  .panel { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  input[type=search], input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 8px 10px; border: 1px solid var(--line); background: #fff; }
  button, a.btn { font: inherit; padding: 8px 12px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
  button.primary, a.primary { background: var(--ink); color: var(--bg); }
  .results { list-style: none; padding: 0; margin: 8px 0 0; }
  .results li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .results img { width: 40px; height: 60px; object-fit: cover; background: var(--empty); }
  .results .meta { color: var(--ink2); font-size: 14px; }
  .editions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .editions button { padding: 0; border: 0; aspect-ratio: 2 / 3; background: var(--empty); }
  .editions img { width: 100%; height: 100%; object-fit: cover; }
  .editions .cap { font-size: 11px; color: var(--ink2); }
  .status { color: var(--ink2); font-size: 14px; min-height: 1.4em; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 id="title">The 9 books that made me</h1>
  <p class="sub" id="sub">Pick nine. Then pick the cover you read them in.</p>

  <div class="grid" id="grid"></div>

  <section class="panel" id="view">
    <p class="status" id="byline"></p>
    <div class="row">
      <button class="primary" id="mine">Make your own</button>
      <button id="editthis">Change this one</button>
    </div>
  </section>

  <section class="panel" id="edit">
    <div class="row">
      <input type="search" id="q" placeholder="Search a title or author" autocomplete="off">
      <button id="go">Search</button>
    </div>
    <p class="status" id="status"></p>
    <ul class="results" id="results"></ul>

    <div id="slotpanel" class="hidden">
      <div class="row">
        <strong id="slottitle"></strong>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="left">◀</button>
        <button id="right">▶</button>
        <button id="change">Change edition</button>
        <button id="remove">Remove</button>
      </div>
      <div class="editions" id="editions"></div>
    </div>

    <div class="panel">
      <div class="row">
        <input type="text" id="by" maxlength="40" placeholder="Your name or handle (optional)">
      </div>
      <div class="row" style="margin-top:8px">
        <a class="btn primary" id="story" download="9-books-story.png">Download for a story</a>
        <a class="btn" id="feed" download="9-books-post.png">Download for a post</a>
        <button id="copy">Copy link</button>
      </div>
      <p class="status" id="count"></p>
    </div>
  </section>
</main>
<script>
/*
  The board as board.ts holds it — mirrored here because the lab page has no
  bundler. Change both together; the tests cover board.ts. Promotion to the
  site puts one module behind both.
*/
const SLOTS = 9, NAME_MAX = 40;
const WORK = /^OL\d{1,10}W$/;
const seg = id => id.replace(':', '-');
function idFromSeg(s) {
  const at = s.indexOf('-'); if (at < 1) return null;
  const src = s.slice(0, at), rest = s.slice(at + 1);
  return (src === 'ol' || src === 'gb') && /^[\w.-]{1,64}$/.test(rest) ? `${src}:${rest}` : null;
}
function cleanName(raw) {
  const one = raw.replace(/[\u0000-\u001f\u007f-\u009f]/g, ' ').replace(/\s+/g, ' ').trim();
  return [...one].slice(0, NAME_MAX).join('').trim();
}
function parseBoard(params) {
  const w = (params.get('w') || '').split(','), c = (params.get('c') || '').split(',');
  const slots = Array.from({ length: SLOTS }, (_, i) => {
    const workId = (w[i] || '').trim(), coverId = idFromSeg((c[i] || '').trim());
    return WORK.test(workId) && coverId ? { workId, coverId, title: '' } : null;
  });
  return { slots, by: cleanName(params.get('by') || '') };
}
function boardQuery(b) {
  if (b.slots.every(s => !s) && !b.by) return '';
  const p = new URLSearchParams();
  p.set('w', b.slots.map(s => s ? s.workId : '').join(','));
  p.set('c', b.slots.map(s => s ? seg(s.coverId) : '').join(','));
  if (b.by) p.set('by', b.by);
  return p.toString().replace(/%2C/g, ',');
}

const $ = id => document.getElementById(id);
const SITE = '{{SITE_URL}}';
let board = parseBoard(new URLSearchParams(location.search));
let editing = location.hash === '#edit' || board.slots.every(s => !s);
let target = -1;          // the slot the next search result goes into
const titles = new Map(); // workId -> title, for the slot panel

function save() {
  const q = boardQuery(board);
  history.replaceState(null, '', (q ? `?${q}` : location.pathname) + (editing ? '#edit' : ''));
  const filled = board.slots.filter(Boolean).length;
  $('count').textContent = filled === SLOTS ? 'Nine. Done.' : `${filled} of 9`;
  $('story').href = `/poster.png?${q}&format=story`;
  $('feed').href = `/poster.png?${q}&format=feed`;
}

function render() {
  $('view').classList.toggle('hidden', editing);
  $('edit').classList.toggle('hidden', !editing);
  $('title').textContent = board.by && !editing ? `The 9 books that made ${board.by}` : 'The 9 books that made me';
  $('sub').classList.toggle('hidden', !editing);
  const grid = $('grid');
  grid.textContent = '';
  board.slots.forEach((s, i) => {
    const el = document.createElement(editing ? 'button' : 'a');
    el.className = 'slot' + (editing && i === target ? ' target' : '');
    if (s) {
      const img = document.createElement('img');
      img.src = `/img/M/${seg(s.coverId)}`;
      img.alt = titles.get(s.workId) || '';
      el.append(img);
      // In the shared view a tile is the way to the book and its shops.
      if (!editing) { el.href = `${SITE}/book/${s.workId}`; el.target = '_blank'; }
    } else {
      el.textContent = editing ? '+' : '';
    }
    if (editing) el.onclick = () => select(i);
    grid.append(el);
  });
  $('by').value = board.by;
  save();
}

function select(i) {
  target = i;
  const s = board.slots[i];
  $('slotpanel').classList.toggle('hidden', !s);
  $('editions').textContent = '';
  if (s) $('slottitle').textContent = titles.get(s.workId) || s.workId;
  else $('q').focus();
  render();
}

async function search() {
  const q = $('q').value.trim();
  if (q.length < 3) return;
  $('status').textContent = 'Looking…';
  $('results').textContent = '';
  const t0 = performance.now();
  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  const body = await res.json();
  if (!res.ok) { $('status').textContent = body.error; return; }
  $('status').textContent = body.works.length ? `${((performance.now() - t0) / 1000).toFixed(1)} s` : 'Open Library knows no book by that.';
  for (const w of body.works) {
    const li = document.createElement('li');
    li.innerHTML = `<img alt=""><div><div></div><div class="meta"></div></div>`;
    if (w.coverId) li.querySelector('img').src = `/img/S/${seg(w.coverId)}`;
    li.querySelector('div > div').textContent = w.title;
    li.querySelector('.meta').textContent = [w.author, w.year].filter(Boolean).join(', ') + (w.coverId ? '' : ' — no cover on record');
    if (w.coverId) li.onclick = () => {
      titles.set(w.id, w.title);
      const i = target >= 0 && !board.slots[target] ? target : board.slots.findIndex(s => !s);
      const at = i >= 0 ? i : target >= 0 ? target : 8;
      const slots = board.slots.map(s => (s && s.workId === w.id ? null : s));
      slots[at] = { workId: w.id, coverId: w.coverId };
      board = { ...board, slots };
      target = board.slots.findIndex(s => !s);
      $('results').textContent = '';
      $('q').value = '';
      $('status').textContent = '';
      render();
      if (target >= 0) $('q').focus();
    };
    $('results').append(li);
  }
}

async function editions() {
  const s = board.slots[target];
  if (!s) return;
  $('editions').textContent = 'Looking for the other editions…';
  const res = await fetch(`/api/covers/${s.workId}`);
  const body = await res.json();
  $('editions').textContent = res.ok ? '' : body.error;
  for (const c of body.covers || []) {
    const b = document.createElement('button');
    b.innerHTML = '<img alt="">';
    b.querySelector('img').src = `/img/S/${seg(c.coverId)}`;
    b.title = [c.year, c.publisher].filter(Boolean).join(', ');
    b.onclick = () => {
      board = { ...board, slots: board.slots.map((x, i) => (i === target ? { ...x, coverId: c.coverId } : x)) };
      render();
    };
    $('editions').append(b);
  }
}

function move(d) {
  const j = target + d;
  if (target < 0 || j < 0 || j >= SLOTS) return;
  const slots = [...board.slots];
  [slots[target], slots[j]] = [slots[j], slots[target]];
  board = { ...board, slots };
  target = j;
  render();
}

$('go').onclick = search;
$('q').onkeydown = e => { if (e.key === 'Enter') search(); };
$('change').onclick = editions;
$('remove').onclick = () => { board = { ...board, slots: board.slots.map((s, i) => (i === target ? null : s)) }; select(target); };
$('left').onclick = () => move(-1);
$('right').onclick = () => move(1);
$('by').oninput = e => { board = { ...board, by: cleanName(e.target.value) }; save(); };
$('copy').onclick = async () => {
  const link = `${location.origin}${location.pathname}?${boardQuery(board)}`;
  await navigator.clipboard.writeText(link).catch(() => {});
  $('count').textContent = 'Link copied.';
};
$('mine').onclick = () => { board = { slots: Array(SLOTS).fill(null), by: '' }; editing = true; target = 0; render(); $('q').focus(); };
$('editthis').onclick = () => { editing = true; render(); };
$('byline').textContent = board.by ? `Chosen by ${board.by}. What are yours?` : 'What are yours?';
if (editing && target < 0) target = board.slots.findIndex(s => !s);
render();
</script>
</body>
</html>
