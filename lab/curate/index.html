<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Cover kuratieren</title>
<style>
  :root { --bg:#f4f0e8; --ink:#1a1714; --ink2:#5d554e; --ink3:#8b8179; --line:#ddd5c8; --accent:#b1502b; --surface:#fffdf8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131110; --ink:#f0ece4; --ink2:#b5ada4; --ink3:#7d746c; --line:#2e2a26; --accent:#e6a677; --surface:#1c1917; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  .meta { color:var(--ink3); font-size:13px; }
  .bar { flex:1; min-width:120px; height:4px; background:var(--line); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  main { padding:16px; }
  .work { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; margin-bottom:4px; }
  .work h2 { font-size:22px; margin:0; }
  .work .author { color:var(--ink2); }
  .yearline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0 14px; font-size:13px; color:var(--ink2); }
  .yearline input { width:6em; padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font:inherit; }
  .warn { color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:10px; }
  .tile { border:0; padding:0; background:none; cursor:pointer; position:relative; }
  .tile img { width:100%; aspect-ratio:2/3; object-fit:contain; background:var(--surface);
              border-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.18); display:block; }
  .tile:hover img, .tile:focus-visible img { outline:3px solid var(--accent); outline-offset:2px; }
  .tile.chosen img { outline:3px solid var(--accent); outline-offset:2px; }
  .tile.cursor img { outline:2px dashed var(--ink3); outline-offset:2px; }
  .tile .size { position:absolute; top:4px; right:4px; font-size:11px; font-weight:600; line-height:1; padding:3px 5px;
                border-radius:4px; background:color-mix(in srgb, var(--bg) 85%, transparent); color:var(--ink3); }
  .tile .size.L { background:var(--accent); color:var(--surface); }
  .tile .size.S { color:#c0392b; }
  .actions { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; }
  button.btn { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); cursor:pointer; }
  button.btn:hover { border-color:var(--accent); color:var(--accent); }
  button.btn.danger { color:var(--ink2); }
  button.btn.danger:hover { border-color:#c0392b; color:#c0392b; }
  .hint { color:var(--ink3); font-size:12px; margin-top:20px; }
  .picked { margin-top:36px; border-top:1px solid var(--line); padding-top:16px; }
  .picked h3 { font-size:14px; margin:0 0 10px; font-weight:600; color:var(--ink2); }
  .picked ul { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:6px 14px; }
  .picked li { display:flex; align-items:center; gap:8px; padding:3px 4px; border-radius:6px; }
  .picked li:hover { background:var(--surface); }
  .picked li.here { background:var(--surface); outline:1px solid var(--accent); }
  .picked img { width:22px; height:33px; object-fit:cover; border-radius:2px; background:var(--line); flex:none; }
  .picked .none { width:22px; height:33px; border:1px dashed var(--line); border-radius:2px; flex:none; }
  .picked button.jump { flex:1; text-align:left; background:none; border:0; padding:0; font:inherit; color:var(--ink); cursor:pointer; overflow:hidden; }
  .picked button.jump span { color:var(--ink3); font-size:12px; }
  .picked button.jump b { font-weight:500; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .picked button.x { background:none; border:0; color:var(--ink3); cursor:pointer; font-size:15px; line-height:1; padding:2px 6px; border-radius:4px; }
  .picked button.x:hover { color:#c0392b; background:color-mix(in srgb, #c0392b 12%, transparent); }
  .done { padding:40px 0; text-align:center; }
  /* Die Liste der offenen Werke (Julian, 2026-09-24): scrollen statt klicken,
     bis man das Buch findet, das man als Nächstes ansehen will. */
  .open { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:14px; margin-top:14px; }
  .open button { font:inherit; text-align:left; background:var(--surface); border:1px solid var(--line);
                 border-radius:8px; padding:8px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
  .open button:hover { border-color:var(--accent); }
  .open .thumb { aspect-ratio:2/3; background:var(--surface-2, #eee); border-radius:4px; overflow:hidden;
                 display:flex; align-items:center; justify-content:center; }
  .open .thumb img { width:100%; height:100%; object-fit:contain; }
  .open .thumb span { font-size:11px; color:var(--ink-3, #888); padding:6px; text-align:center; }
  .open b { font-size:13px; font-weight:600; line-height:1.25; }
  .open .who { font-size:12px; color:var(--ink-2, #666); }
  .open .tag { font-size:11px; color:var(--ink-3, #888); }
  .open .tag.skipped { color:var(--accent); }
  .tabs { display:flex; gap:4px; }
  .tabs button { font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--line); background:var(--surface);
                 color:var(--ink2); border-radius:999px; cursor:pointer; }
  .tabs button[aria-current="true"] { border-color:var(--accent); color:var(--accent); }
  .order { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px; align-items:start; }
  @media (max-width: 900px) { .order { grid-template-columns:minmax(0,1fr); } }
  .order h3 { font-size:13px; font-weight:600; color:var(--ink2); margin:0 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  /* minmax(0,…), not 1fr: a bare 1fr never goes below the image's own width,
     which pulls the columns to different sizes and the wall out of true. */
  .desk { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:14px; align-items:start; }
  .phone { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px; align-items:start; border:1px solid var(--line);
           border-radius:14px; padding:10px; background:var(--surface); }
  .side { position:sticky; top:64px; }
  .cell { position:relative; cursor:grab; }
  .cell.dragging { opacity:.35; }
  .cell.over { outline:2px dashed var(--accent); outline-offset:3px; border-radius:4px; }
  .cell img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:3px; background:var(--surface);
              box-shadow:0 1px 3px rgba(0,0,0,.2); display:block; pointer-events:none; }
  .cell .n { position:absolute; top:2px; left:2px; font-size:10px; padding:1px 4px; border-radius:3px;
             background:color-mix(in srgb, var(--bg) 80%, transparent); color:var(--ink3); }
  .cell .t { font-size:11px; color:var(--ink3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cut { grid-column:1/-1; border-top:1px dashed var(--accent); margin:2px 0 6px; position:relative; }
  .cut span { position:absolute; top:-9px; left:0; font-size:10px; color:var(--accent);
              background:var(--bg); padding:0 6px; }
</style>
</head>
<body>
<header>
  <h1>Cover kuratieren</h1>
  <span class="meta" id="progress">…</span>
  <span class="bar"><i id="barfill" style="width:0"></i></span>
  <span class="meta" id="position"></span>
  <span class="tabs">
    <button id="tab-pick" aria-current="true">Kuratieren</button>
    <button id="tab-open" aria-current="false">Offen</button>
    <button id="tab-order" aria-current="false">Reihenfolge</button>
  </span>
</header>
<main id="main">Lade …</main>

<script>
const state = { works: [], struck: [], i: 0, cursor: 0, years: {}, sizes: {}, dropped: 0, view: 'pick', order: [], drag: null };
const $ = id => document.getElementById(id);
// Through the tool, which keeps every image it fetched and sends at most six to Open Library at once (serve.ts, coverImage).
const cover = (id, size) => id.startsWith('ol:') ? `/img/${size}/${id.slice(3)}.jpg` : '';
// A cover that did not come is asked again twice, a few seconds apart; the server's 504 means Open Library stayed silent.
document.addEventListener('error', (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || !img.src.includes('/img/')) return;
  const tries = Number(img.dataset.tries ?? 0);
  if (tries >= 2) return;
  img.dataset.tries = String(tries + 1);
  setTimeout(() => { img.src = img.src.split('?')[0] + '?try=' + (tries + 1); }, 3000 * (tries + 1));
}, true);

async function load() {
  const data = await (await fetch('/api/works')).json();
  // Struck-off works leave the run entirely; the choice itself stays on disk.
  state.struck = data.works.filter(w => w.pick?.dropped);
  state.dropped = state.struck.length;
  state.works = data.works.filter(w => !w.pick?.dropped);
  state.order = data.order ?? [];
  const firstOpen = state.works.findIndex(w => !w.pick);
  state.i = firstOpen < 0 ? 0 : firstOpen;
  render();
}

function progress() {
  const done = state.works.filter(w => w.pick && !w.pick.skipped).length;
  $('progress').textContent = `${done} von ${state.works.length} gewählt${state.dropped ? ` · ${state.dropped} gestrichen` : ''}`;
  $('barfill').style.width = `${(done / state.works.length) * 100}%`;
  $('position').textContent = `Nr. ${state.i + 1}`;
  const open = state.works.filter(w => !w.pick || w.pick.skipped).length;
  $('tab-open').textContent = `Offen (${open})`;
}

async function fetchYears(work) {
  if (state.years[work.id]) return state.years[work.id];
  const info = await (await fetch(`/api/years?id=${work.id}`)).json();
  state.years[work.id] = info;
  return info;
}

/**
 * Welche Größe Open Library von einem Cover wirklich hat (Julian, 2026-10-07).
 * Jedes Cover gibt es als -S, -M und -L, aber aus einem kleinen Scan wird
 * kein großes Bild: -L ist dann nur das Original. Die Kästen, gemessen am
 * 2026-10-07 an zwei Covern: L passt in 500 × 500, M ist 180 breit (bis 360
 * hoch), S 58 hoch. „L" heißt also, das Original füllt den L-Kasten.
 */
function sizeClass(size) {
  if (!size) return '?';
  if (Math.max(size.width, size.height) >= 500) return 'L';
  if (size.width >= 180 || size.height >= 360) return 'M';
  return 'S';
}
const SIZE_RANK = { L: 0, M: 1, S: 2, '?': 3 };

/**
 * Holt die Größen eines Werks und stellt seine Cover einmal um: L vorn,
 * dann M, S und die, deren Größe niemand nennt — innerhalb einer Klasse in
 * Open Librarys Reihenfolge. Umgestellt wird nur hier, beim Eintreffen,
 * nie später, damit nichts unter dem Mauszeiger wegrutscht.
 */
async function loadSizes(w, quiet = false) {
  if (state.sizes[w.id] || w.covers.length === 0) return;
  state.sizes[w.id] = 'pending';
  let sizes = {};
  // Der Server antwortet nach spätestens acht Sekunden mit dem, was er hat,
  // und sagt, wie viele Datensätze noch unterwegs sind; dann wird nachgefragt.
  // Bei einem kalten Werk mit 150 Covern dauert das ein paar Runden.
  for (let round = 0; round < 8; round++) {
    try {
      const res = await (await fetch(`/api/sizes?id=${w.id}`)).json();
      sizes = res.sizes ?? {};
      if (!res.pending) break;
    } catch {
      // Ohne Antwort bleiben die Cover in ihrer Reihenfolge und tragen ein „?".
      break;
    }
  }
  state.sizes[w.id] = sizes;
  const rank = c => SIZE_RANK[sizeClass(sizes[c])];
  w.covers = w.covers.map((c, n) => ({ c, n })).sort((a, b) => rank(a.c) - rank(b.c) || a.n - b.n).map(x => x.c);
  if (!quiet && state.view === 'pick' && state.works[state.i]?.id === w.id) render();
}

function sizeBadge(w, c) {
  const sizes = state.sizes[w.id];
  if (!sizes || sizes === 'pending') return '';
  const size = sizes[c];
  const k = sizeClass(size);
  const title = size ? `${size.width} × ${size.height} px` : 'Größe unbekannt';
  return `<span class="size ${k}" title="${title}">${k}</span>`;
}

/** How many tiles the home page shows; the line in the previews marks it. */
const WALL_SIZE = 18;

/** The arranged order, as the works that actually carry a cover. */
function orderedPicks() {
  const byId = new Map(state.works.map(w => [w.id, w]));
  const out = [];
  const seen = new Set();
  for (const id of state.order) {
    const w = byId.get(id);
    if (w && w.pick && !w.pick.skipped && w.pick.coverId && !seen.has(id)) { out.push(w); seen.add(id); }
  }
  for (const w of state.works) {
    if (w.pick && !w.pick.skipped && w.pick.coverId && !seen.has(w.id)) { out.push(w); seen.add(w.id); }
  }
  return out;
}

function renderOrder() {
  const list = orderedPicks();
  const cell = (w, n, withTitle) => `
    ${n === WALL_SIZE ? `<div class="cut"><span>ab hier nicht mehr auf der Startseite</span></div>` : ''}
    <div class="cell" draggable="${withTitle}" data-id="${w.id}" data-n="${n}" title="${escapeHtml(w.title)}">
      <img loading="lazy" src="${cover(w.pick.coverId, 'M')}" alt="">
      ${withTitle ? `<span class="n">${n + 1}</span><div class="t">${escapeHtml(w.title)}</div>` : ''}
    </div>`;

  $('main').innerHTML = `
    <div class="order">
      <div>
        <h3>Desktop · sechs je Reihe — ziehen zum Umsortieren</h3>
        <div class="desk" id="desk">${list.map((w, n) => cell(w, n, true)).join('')}</div>
        <p class="hint">Die ersten ${WALL_SIZE} stehen auf der Startseite, in genau dieser Reihenfolge.
           Rechts dieselbe Reihenfolge, wie sie auf dem Telefon ankommt.</p>
      </div>
      <div class="side">
        <h3>Telefon · drei je Reihe</h3>
        <div class="phone">${list.map((w, n) => cell(w, n, false)).join('')}</div>
      </div>
    </div>`;

  const desk = $('desk');
  desk.addEventListener('dragstart', e => {
    const c = e.target.closest('.cell');
    if (!c) return;
    state.drag = c.dataset.id;
    c.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  desk.addEventListener('dragend', () => {
    state.drag = null;
    desk.querySelectorAll('.cell').forEach(c => c.classList.remove('dragging', 'over'));
  });
  desk.addEventListener('dragover', e => {
    e.preventDefault();
    const c = e.target.closest('.cell');
    desk.querySelectorAll('.cell').forEach(x => x.classList.toggle('over', x === c));
  });
  desk.addEventListener('drop', e => {
    e.preventDefault();
    const target = e.target.closest('.cell');
    if (!target || !state.drag) return;
    moveTo(state.drag, Number(target.dataset.n));
  });
}

/** Move one work to a position and persist the whole order. */
async function moveTo(id, to) {
  const ids = orderedPicks().map(w => w.id);
  const from = ids.indexOf(id);
  if (from < 0 || from === to) return;
  ids.splice(to, 0, ids.splice(from, 1)[0]);
  state.order = ids;
  renderOrder();
  await fetch('/api/order', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ ids }),
  });
}

/**
 * Die offenen Werke, zum Durchscrollen (Julian, 2026-09-24: „dass ich leichter
 * durch die liste scrollen kann von denen, die ich noch nicht kuratiert hab").
 *
 * Offen heißt: noch keine Wahl, oder übersprungen und damit für später
 * behalten. Gestrichene sind gar nicht mehr in `state.works`. Ein Klick
 * springt in die Kuratieren-Ansicht auf genau dieses Buch.
 */
function openWorks() {
  return state.works
    .map((w, i) => ({ w, i }))
    .filter(({ w }) => !w.pick || w.pick.skipped);
}

function renderOpen() {
  const open = openWorks();
  const cards = open.map(({ w, i }) => `
    <button data-i="${i}">
      <span class="thumb">${w.covers.length
        ? `<img loading="lazy" src="${cover(w.covers[0], 'M')}" alt="">`
        : '<span>Cover werden geholt …</span>'}</span>
      <b>${escapeHtml(w.title)}</b>
      <span class="who">${escapeHtml(w.author)}</span>
      <span class="tag${w.pick?.skipped ? ' skipped' : ''}">${w.pick?.skipped ? 'übersprungen · ' : ''}${w.covers.length} Cover${w.note ? ` · ${escapeHtml(w.note)}` : ''}</span>
    </button>`).join('');

  // Gestrichene stehen hier, weil sie sonst nirgends stehen: ein Strich war
  // bis zum 2026-09-24 nur durch Editieren der Datei umkehrbar.
  const struck = state.struck.map(w => `
    <button data-restore="${w.id}" title="zurück in den Durchlauf">
      <span class="thumb">${w.covers.length
        ? `<img loading="lazy" src="${cover(w.covers[0], 'M')}" alt="">`
        : '<span>kein Cover geladen</span>'}</span>
      <b>${escapeHtml(w.title)}</b>
      <span class="who">${escapeHtml(w.author)}</span>
      <span class="tag">gestrichen · zurückholen</span>
    </button>`).join('');

  $('main').innerHTML = `
    <p class="hint" style="margin-top:12px"><b>${open.length}</b> von ${state.works.length} Werken sind noch offen.
       Klick springt zum Buch. Übersprungene stehen mit dabei.</p>
    <div class="open" id="openlist">${cards || '<p class="done">Nichts mehr offen.</p>'}</div>
    ${state.struck.length ? `
      <h2 style="font-size:15px; margin:28px 0 0">Gestrichen (${state.struck.length})</h2>
      <p class="hint">Ein Klick holt das Buch als offenes zurück.</p>
      <div class="open" id="strucklist">${struck}</div>` : ''}`;

  $('strucklist')?.addEventListener('click', async e => {
    const b = e.target.closest('button[data-restore]');
    if (!b) return;
    await fetch('/api/pick', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id: b.dataset.restore, restore: true }),
    });
    await load();
    state.view = 'open';
    render();
  });

  $('openlist')?.addEventListener('click', e => {
    const b = e.target.closest('button[data-i]');
    if (!b) return;
    state.i = Number(b.dataset.i);
    state.view = 'pick';
    render();
    window.scrollTo(0, 0);
  });
}

function render() {
  if (state.view === 'open') {
    progress();
    $('tab-pick').setAttribute('aria-current', 'false');
    $('tab-open').setAttribute('aria-current', 'true');
    $('tab-order').setAttribute('aria-current', 'false');
    renderOpen();
    // Die ersten Kacheln ohne Cover nachladen, damit die Liste nicht grau bleibt.
    for (const { w } of openWorks().filter(({ w }) => w.covers.length === 0).slice(0, 4)) loadCovers(w);
    return;
  }
  $('tab-open').setAttribute('aria-current', 'false');
  if (state.view === 'order') {
    progress();
    $('tab-pick').setAttribute('aria-current', 'false');
    $('tab-order').setAttribute('aria-current', 'true');
    renderOrder();
    return;
  }
  $('tab-pick').setAttribute('aria-current', 'true');
  $('tab-order').setAttribute('aria-current', 'false');
  const w = state.works[state.i];
  if (!w) { $('main').innerHTML = '<p class="done">Fertig.</p>'; return; }
  state.cursor = Math.max(0, w.covers.findIndex(c => c === w.pick?.coverId));
  progress();

  const tiles = w.covers.map((c, n) => `
    <button class="tile ${w.pick?.coverId === c ? 'chosen' : ''} ${n === state.cursor ? 'cursor' : ''}"
            data-cover="${c}" data-n="${n}" title="${c}${sizeTitle(w, c)}">
      <img loading="lazy" src="${cover(c, 'M')}" alt="">${sizeBadge(w, c)}
    </button>`).join('');
  const sizes = state.sizes[w.id];
  const counts = { L: 0, M: 0, S: 0, '?': 0 };
  if (sizes && sizes !== 'pending') for (const c of w.covers) counts[sizeClass(sizes[c])] += 1;
  const sizeLine = !sizes || sizes === 'pending'
    ? (w.covers.length ? '· Größen werden gelesen …' : '')
    : `· ${counts.L} L · ${counts.M} M · ${counts.S} S${counts['?'] ? ` · ${counts['?']} ohne Größe` : ''}`;

  $('main').innerHTML = `
    <div class="work">
      <h2>${escapeHtml(w.title)}</h2><span class="author">${escapeHtml(w.author)}</span>
      <span class="meta">${w.covers.length} Cover ${sizeLine}</span>
      ${w.note ? `<span class="meta">· ${escapeHtml(w.note)}</span>` : ''}
    </div>
    <div class="yearline">
      <label>Erstausgabe <input id="year" type="number" inputmode="numeric" value="${w.pick?.firstPublished ?? ''}" placeholder="Jahr"></label>
      <span id="yearinfo" class="meta">Jahre werden geholt …</span>
    </div>
    <div class="actions">
      <button class="btn" id="prev">← zurück</button>
      <button class="btn" id="skip">überspringen</button>
      <button class="btn danger" id="drop">aus der Liste streichen</button>
      <button class="btn" id="next">weiter →</button>
      <button class="btn" id="nextopen">nächstes offenes ⇥</button>
    </div>
    <div class="grid" id="grid">${tiles}</div>
    <section class="picked" id="picked"></section>
    <p class="hint">Klick wählt und springt weiter. Pfeiltasten bewegen den Rahmen, Enter wählt, Backspace zurück.
       Das Jahr wird mit der Wahl gespeichert; leer heißt „nicht geprüft".
       „Überspringen" behält das Buch für später, „streichen" nimmt es dauerhaft aus der Liste und von der Startseite.</p>`;

  // Ein Vorschlag bringt seine Cover nicht mit. Fehlen sie, werden sie geholt;
  // und die nächsten drei Werke gleich mit, still im Hintergrund, damit das
  // Weiterklicken nicht jedes Mal wartet (Julian, 2026-09-09).
  if (w.covers.length === 0) loadCovers(w);
  else loadSizes(w);
  prefetchNext(3);

  $('grid').addEventListener('click', e => {
    const t = e.target.closest('.tile');
    if (t) choose(t.dataset.cover);
  });
  $('prev').onclick = () => { state.i = Math.max(0, state.i - 1); render(); };
  $('next').onclick = () => { state.i = Math.min(state.works.length - 1, state.i + 1); render(); };
  // Das nächste Buch ohne Wahl, von hier aus vorwärts und sonst von vorn.
  $('nextopen').onclick = () => {
    const open = openWorks().map(({ i }) => i);
    const next = open.find(i => i > state.i) ?? open[0];
    if (next === undefined) return;
    state.i = next;
    render();
    window.scrollTo(0, 0);
  };
  $('skip').onclick = () => save({ skipped: true });
  $('drop').onclick = () => save({ dropped: true });

  renderPicked();

  fetchYears(w).then(info => {
    const el = $('yearinfo');
    if (!el) return;
    const differs = info.reported !== info.guarded;
    el.innerHTML = info.reported == null
      ? 'Open Library nennt kein Jahr.'
      : `Open Library: <b>${info.reported}</b>${differs ? ` <span class="warn">→ nach Ausreißerprüfung ${info.guarded}</span>` : ''}
         · älteste Jahre: ${info.years.slice(0, 5).join(', ') || '–'}`;
    const field = $('year');
    if (field && !field.value && info.guarded) field.value = info.guarded;
  });
}

const fetching = new Set();

/** Holt die Cover eines Werks; zeichnet neu, wenn es noch das offene ist. */
async function loadCovers(w, quiet = false) {
  if (fetching.has(w.id)) return;
  fetching.add(w.id);
  const grid = $('grid');
  if (!quiet && grid) grid.innerHTML = '<p class="hint">Cover werden geholt …</p>';
  try {
    const res = await (await fetch(`/api/covers?id=${w.id}`)).json();
    w.covers = res.covers ?? [];
  } catch {
    w.covers = [];
  } finally {
    fetching.delete(w.id);
  }
  if (!quiet && state.works[state.i]?.id === w.id) render();
}

/**
 * Zieht die nächsten Werke vor, ohne etwas anzuzeigen. Der Server holt
 * parallel den ganzen Rest; das hier ist nur die Versicherung, dass genau
 * das nächste Buch schon da ist, wenn es aufgeschlagen wird.
 */
function prefetchNext(n) {
  for (let k = 1; k <= n; k++) {
    const next = state.works[state.i + k];
    if (!next) continue;
    if (next.covers.length === 0) void loadCovers(next, true).then(() => loadSizes(next, true));
    else void loadSizes(next, true);
  }
}

function sizeTitle(w, c) {
  const size = state.sizes[w.id]?.[c];
  return size ? ` · ${size.width} × ${size.height} px` : '';
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

/**
 * Everything already seen, at the foot of the page: click a row to go back
 * and choose again, or the × to strike the book off the list. Skipped works
 * are in here too — they are exactly the ones worth a second look.
 */
function renderPicked() {
  const el = $('picked');
  if (!el) return;
  const rows = state.works
    .map((w, n) => ({ w, n }))
    .filter(({ w }) => w.pick);
  if (rows.length === 0) { el.innerHTML = ''; return; }

  el.innerHTML = `<h3>Schon angesehen (${rows.length}) — anklicken, um zurückzuspringen</h3>
    <ul>${rows.map(({ w, n }) => `
      <li class="${n === state.i ? 'here' : ''}">
        ${w.pick.coverId ? `<img loading="lazy" src="${cover(w.pick.coverId, 'S')}" alt="">` : '<span class="none"></span>'}
        <button class="jump" data-n="${n}" title="${escapeHtml(w.title)}">
          <b>${escapeHtml(w.title)}</b>
          <span>${escapeHtml(w.author)}${w.pick.skipped ? ' · übersprungen' : ''}${w.pick.firstPublished ? ' · ' + w.pick.firstPublished : ''}</span>
        </button>
        <button class="x" data-drop="${n}" title="aus der Liste streichen">×</button>
      </li>`).join('')}</ul>`;

  el.addEventListener('click', e => {
    const jump = e.target.closest('.jump');
    if (jump) { state.i = Number(jump.dataset.n); render(); window.scrollTo({ top: 0 }); return; }
    const x = e.target.closest('.x');
    if (x) dropAt(Number(x.dataset.drop));
  });
}

/** Strike a work off from the list at the foot, without leaving the one on screen. */
async function dropAt(n) {
  const w = state.works[n];
  if (!w) return;
  await fetch('/api/pick', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: w.id, dropped: true }),
  });
  const current = state.works[state.i];
  state.works.splice(n, 1);
  state.dropped += 1;
  const at = state.works.indexOf(current);
  state.i = at >= 0 ? at : Math.min(state.i, state.works.length - 1);
  render();
}

async function choose(coverId) { await save({ coverId }); }

async function save(extra) {
  const w = state.works[state.i];
  const yearField = $('year');
  const year = yearField && yearField.value ? Number(yearField.value) : undefined;
  const body = { id: w.id, firstPublished: year, ...extra };
  const res = await (await fetch('/api/pick', {
    method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
  })).json();
  if (res.error) { alert(res.error); return; }
  if (extra.dropped) {
    // Out of the run: drop it from the list and stay put, which now shows the
    // next work. The entry itself is kept on disk so it never comes back.
    state.works.splice(state.i, 1);
    state.dropped += 1;
    state.i = Math.min(state.i, state.works.length - 1);
  } else {
    w.pick = { ...(extra.skipped ? { skipped: true, coverId: '' } : { coverId: extra.coverId }), firstPublished: year };
    state.i = Math.min(state.works.length - 1, state.i + 1);
  }
  render();
}

document.getElementById('tab-open').onclick = () => { state.view = 'open'; render(); };
document.getElementById('tab-pick').onclick = () => { state.view = 'pick'; render(); };
document.getElementById('tab-order').onclick = () => { state.view = 'order'; render(); };

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || state.view === 'order') return;
  const w = state.works[state.i];
  if (!w) return;
  const cols = Math.max(1, Math.floor(document.getElementById('grid').clientWidth / 120));
  const move = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
  if (move) {
    e.preventDefault();
    state.cursor = Math.max(0, Math.min(w.covers.length - 1, state.cursor + move));
    document.querySelectorAll('.tile').forEach((t, n) => t.classList.toggle('cursor', n === state.cursor));
    document.querySelectorAll('.tile')[state.cursor]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    choose(w.covers[state.cursor]);
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    state.i = Math.max(0, state.i - 1); render();
  }
});

load();
</script>
</body>
</html>
