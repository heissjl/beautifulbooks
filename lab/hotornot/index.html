<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover · Hot or Not</title>
<style>
  :root { --bg:#f4f0e8; --ink:#1a1714; --ink2:#5d554e; --ink3:#8b8179; --line:#ddd5c8; --accent:#b1502b; --surface:#fffdf8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131110; --ink:#f0ece4; --ink2:#b5ada4; --ink3:#7d746c; --line:#2e2a26; --accent:#e6a677; --surface:#1c1917; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  .meta { color:var(--ink3); font-size:13px; }
  nav { margin-left:auto; display:flex; gap:12px; font-size:14px; }
  a { color:var(--accent); }
  main { max-width:820px; margin:0 auto; padding:18px 16px 60px; }
  .q { text-align:center; font-size:22px; margin:4px 0 16px; }
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .side { display:flex; flex-direction:column; gap:6px; }
  .pick { border:0; padding:0; background:none; cursor:pointer; display:block; width:100%; }
  /* contain, never cover: cropping a design changes the verdict on it */
  .pick img { width:100%; aspect-ratio:2/3; object-fit:contain; background:var(--surface); border-radius:4px;
              box-shadow:0 1px 5px rgba(0,0,0,.18); display:block; transition:transform .12s ease; }
  .pick:hover img, .pick:focus-visible img { transform:translateY(-3px); }
  .pick:focus-visible { outline:3px solid var(--accent); outline-offset:3px; border-radius:6px; }
  .pick:disabled { cursor:progress; opacity:.6; }
  .small { background:none; border:0; color:var(--ink3); font:inherit; font-size:13px; cursor:pointer; padding:2px; text-decoration:underline; }
  .row { display:flex; justify-content:center; gap:10px; margin-top:14px; }
  button.btn { font:inherit; padding:6px 14px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); cursor:pointer; }
  .hint { text-align:center; color:var(--ink3); font-size:13px; margin-top:8px; }
  .lead { font-size:15px; color:var(--ink2); }
  .lead b { color:var(--ink); }
  h2 { font-size:19px; margin:26px 0 4px; }
  .verdict { font-size:14px; color:var(--ink2); margin:0 0 10px; }
  .five { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:10px; }
  .card img { width:100%; aspect-ratio:2/3; object-fit:contain; background:var(--surface); border-radius:3px; box-shadow:0 1px 4px rgba(0,0,0,.15); }
  .card .t { font-size:12px; line-height:1.3; margin-top:5px; }
  .card .s { font-size:11px; color:var(--ink3); }
  .card:first-child img { outline:3px solid var(--accent); outline-offset:2px; }
  .offline { text-align:center; color:var(--ink2); }
  @media (max-width:560px) { .five { grid-template-columns:repeat(3, minmax(0,1fr)); } }
</style>
</head>
<body>
<header>
  <h1>Cover · Hot or Not</h1>
  <span class="meta" id="meta"></span>
  <nav><a href="#play">Spielen</a><a href="#board">Rangliste</a></nav>
</header>
<main id="main">Lade …</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const pct = x => `${Math.round(x * 100)} %`;
let pair = null;
let busy = false;

async function getJson(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

async function post(path, data) {
  const res = await fetch(path, { method:'POST', headers:{ 'content-type':'application/json' }, body:JSON.stringify(data) });
  if (!res.ok) throw new Error(`${path}: ${res.status}`);
  return res.json();
}

/**
 * The server did not answer. Said as such, never shown as an empty board or
 * a finished game: a silent source is not a result (SPEC F1.7, N12).
 */
function offline() {
  busy = false;
  pair = null;
  $('main').innerHTML = `
    <p class="offline">Der Spiel-Server antwortet nicht. Läuft <code>npx tsx lab/hotornot/serve.ts</code> noch?</p>
    <div class="row"><button class="btn" id="again">Nochmal versuchen</button></div>`;
  $('again').addEventListener('click', route);
}

function meta(p) { $('meta').textContent = `${p.votes} Stimmen · ${p.covers} Cover · ${p.pool}`; }

async function nextPair() {
  busy = true;
  let p;
  try { p = await getJson('/api/pair'); } catch { return offline(); }
  meta(p);
  if (p.done) { busy = false; $('main').innerHTML = '<p>Zu wenige Cover übrig.</p>'; return; }
  pair = p;
  $('main').innerHTML = `
    <p class="q">Welches Cover ist schöner?</p>
    <div class="duo">
      ${['a','b'].map(k => `
        <div class="side">
          <button class="pick" data-k="${k}" aria-label="${k === 'a' ? 'Linkes' : 'Rechtes'} Cover wählen">
            <img src="${esc(p[k].url)}" alt="" data-id="${esc(p[k].id)}">
          </button>
          <button class="small" data-not="${esc(p[k].id)}">ist kein Cover</button>
        </div>`).join('')}
    </div>
    <div class="row"><button class="btn" id="skip">Weiß nicht</button></div>
    <p class="hint">← und → wählen, ↓ überspringt. Der Titel kommt erst in der Rangliste: hier zählt das Cover, nicht das Buch.</p>`;
  document.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => vote(b.dataset.k)));
  document.querySelectorAll('[data-not]').forEach(b => b.addEventListener('click', () => flag(b.dataset.not, 'reported')));
  $('skip').addEventListener('click', () => { if (!busy) nextPair(); });
  // A cover that does not load cannot be judged; it leaves the pool rather than lose every game.
  // The id is the image's own, and an image no longer on screen is ignored: replacing the
  // pair can abort a load, and that must never flag a cover of the pair shown next.
  document.querySelectorAll('.pick img').forEach(img => img.addEventListener('error', () => {
    if (img.isConnected) flag(img.dataset.id, 'broken');
  }, { once:true }));
  busy = false;
}

async function vote(k) {
  if (busy || !pair) return;
  busy = true;
  document.querySelectorAll('.pick').forEach(b => { b.disabled = true; });
  try { await post('/api/vote', { a:pair.a.id, b:pair.b.id, winner:pair[k].id }); } catch { return offline(); }
  nextPair();
}

async function flag(id, reason) {
  if (!id || busy) return;
  busy = true;
  try { await post('/api/not-a-cover', { id, reason }); } catch { return offline(); }
  nextPair();
}

function say(verdict, held, need) {
  if (verdict === 'exact') return `Das ist ein Befund: ${need} Runden in Folge vorn.`;
  if (verdict === 'rising') return `Vorn, aber erst seit ${held === 1 ? 'einer Runde' : `${held} Runden`}. Ein Befund erst nach ${need} Runden in Folge.`;
  if (verdict === 'three') return 'Sicher ist nur: eines der drei.';
  return 'Noch kein Befund. Mehr Stimmen.';
}

function cards(list, end) {
  return list.map(c => `
    <div class="card">
      <img src="${esc(c.url)}" alt="${esc(c.title)}">
      <div class="t">${esc(c.title)}<br><span class="s">${esc(c.author)}</span></div>
      <div class="s">${end === 'best' ? `Platz 1 in ${pct(c.first)}` : `letzter in ${pct(c.last)}`} · ${c.games} Spiele</div>
    </div>`).join('');
}

async function board() {
  let b;
  try { b = await getJson('/api/board'); } catch { return offline(); }
  meta(b);
  const fav = b.favourite.decided >= 50
    ? `Der Favorit gewinnt <b>${pct(b.favourite.rate)}</b> der späteren Stimmen; 50 % wäre reiner Geschmack.`
    : 'Für eine Aussage über die Einigkeit sind es noch zu wenige Stimmen.';
  $('main').innerHTML = `
    <p class="lead"><b>${b.votes}</b> Stimmen über <b>${b.covers}</b> Cover, im Schnitt ${b.perCover.toFixed(1)} Spiele je Cover. ${fav}
      Die Anteile sagen, in wie vielen von 100 Ranglisten, die zu diesen Stimmen passen, ein Cover am Ende steht.
      Ein Cover mit wenigen Spielen ist unsicher und wird deshalb nicht gekrönt, und eine Krone zählt erst,
      wenn dasselbe Cover sie ${b.hold} Runden in Folge hält. Eine Runde sind so viele Stimmen, wie es Cover gibt.</p>
    <h2>Die schönsten</h2>
    <p class="verdict">${b.top[0] ? `Schönstes: in ${pct(b.top[0].first)} der möglichen Ranglisten Platz 1, in ${pct(b.top[0].topThree)} unter den ersten drei. ${say(b.best, b.bestHeld, b.hold)}` : ''}</p>
    <div class="five">${cards(b.top, 'best')}</div>
    <h2>Die hässlichsten</h2>
    <p class="verdict">${b.bottom[0] ? `Hässlichstes: in ${pct(b.bottom[0].last)} der möglichen Ranglisten der letzte, in ${pct(b.bottom[0].bottomThree)} unter den letzten drei. ${say(b.worst, b.worstHeld, b.hold)}` : ''}</p>
    <div class="five">${cards(b.bottom, 'worst')}</div>
    <p class="hint">${b.notCovers} als „kein Cover" aussortiert. Vor jedem Weitersagen gehören die letzten fünf von einem Menschen angesehen: ein Platzhalter ist kein hässliches Cover.</p>`;
}

function route() { (location.hash === '#board' ? board : nextPair)(); }
window.addEventListener('hashchange', route);
document.addEventListener('keydown', e => {
  if (location.hash === '#board' || !pair || busy) return;
  if (e.key === 'ArrowLeft') vote('a');
  else if (e.key === 'ArrowRight') vote('b');
  else if (e.key === 'ArrowDown') nextPair();
});
route();
</script>
</body>
</html>
