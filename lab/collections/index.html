<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sammlungen kuratieren</title>
<style>
  :root { --bg:#f4f0e8; --ink:#1a1714; --ink2:#5d554e; --ink3:#8b8179; --line:#ddd5c8; --accent:#b1502b; --surface:#fffdf8; --danger:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#131110; --ink:#f0ece4; --ink2:#b5ada4; --ink3:#7d746c; --line:#2e2a26; --accent:#e6a677; --surface:#1c1917; --danger:#e57373; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(8px);
           border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0; font-weight:600; }
  h2 { font-size:13px; font-weight:600; color:var(--ink2); margin:0 0 10px; text-transform:uppercase; letter-spacing:.04em; }
  main { padding:16px; max-width:1200px; }
  section { margin-bottom:34px; }
  .meta { color:var(--ink3); font-size:13px; }
  .tabs { display:flex; gap:4px; flex-wrap:wrap; }
  .tabs button, .chip { font:inherit; font-size:13px; padding:4px 10px; border:1px solid var(--line); background:var(--surface);
                 color:var(--ink2); border-radius:999px; cursor:pointer; }
  .tabs button[aria-current="true"] { border-color:var(--accent); color:var(--accent); }
  input[type=text], textarea, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); }
  textarea { width:100%; min-height:70px; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .row label { font-size:13px; color:var(--ink2); }
  .grow { flex:1; min-width:200px; }
  button.btn { font:inherit; font-size:14px; padding:5px 12px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); cursor:pointer; }
  button.btn:hover { border-color:var(--accent); color:var(--accent); }
  button.btn.danger:hover { border-color:var(--danger); color:var(--danger); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-flex; gap:6px; align-items:center; cursor:default; }
  .chip small { color:var(--ink3); }
  .chip button { border:0; background:none; color:var(--ink3); cursor:pointer; font-size:14px; padding:0 2px; }
  .chip button:hover { color:var(--danger); }
  .found { list-style:none; padding:0; margin:6px 0 0; }
  .found li { display:flex; gap:10px; align-items:baseline; padding:4px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .found li span { color:var(--ink3); font-size:12px; flex:1; }
  .error { color:var(--danger); font-size:13px; }
  .note { color:var(--ink3); font-size:12px; }
  /* The wall, as on the site: six across, drag to reorder. */
  .wall { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); gap:14px; align-items:start; }
  @media (max-width: 700px) { .wall { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
  .cell { position:relative; cursor:grab; }
  .cell.dragging { opacity:.35; }
  .cell.over { outline:2px dashed var(--accent); outline-offset:3px; border-radius:4px; }
  .cell img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:3px; background:var(--surface);
              box-shadow:0 1px 3px rgba(0,0,0,.2); display:block; }
  .cell .t { font-size:12px; margin-top:4px; line-height:1.3; }
  .cell .a { font-size:11px; color:var(--ink3); }
  .cell .x { position:absolute; top:3px; right:3px; border:0; border-radius:4px; font-size:13px; line-height:1; padding:3px 6px; cursor:pointer;
             background:color-mix(in srgb, var(--bg) 85%, transparent); color:var(--ink2); }
  .cell .x:hover { color:var(--danger); }
  .cell .n { position:absolute; top:3px; left:3px; font-size:10px; padding:1px 4px; border-radius:3px;
             background:color-mix(in srgb, var(--bg) 80%, transparent); color:var(--ink3); }
  details.source { border:1px solid var(--line); border-radius:8px; background:var(--surface); margin-bottom:8px; }
  details.source > summary { cursor:pointer; padding:8px 12px; font-weight:500; }
  details.source > summary small { color:var(--ink3); font-weight:400; margin-left:6px; }
  .cands { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:4px 14px; padding:4px 12px 12px; }
  .cand { display:flex; gap:8px; align-items:center; border:0; background:none; text-align:left; font:inherit; color:var(--ink);
          padding:4px; border-radius:6px; cursor:pointer; }
  .cand:hover { background:var(--bg); }
  .cand img, .cand .none { width:30px; height:45px; object-fit:cover; border-radius:2px; background:var(--line); flex:none; }
  .cand b { font-weight:500; display:block; font-size:14px; line-height:1.25; }
  .cand span { color:var(--ink3); font-size:12px; }
  .cand.in b::after { content:" ✓"; color:var(--accent); }
  dialog { border:1px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); width:min(1100px, 94vw); max-height:88vh; padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dhead { position:sticky; top:0; background:var(--bg); padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .dhead h3 { margin:0; font-size:18px; }
  .dbody { padding:16px; }
  .pick { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:12px; }
  .tile { border:0; padding:0; background:none; cursor:pointer; text-align:left; color:var(--ink); font:inherit; }
  .tile img { width:100%; aspect-ratio:2/3; object-fit:contain; background:var(--surface); border-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.18); display:block; }
  .tile:hover img, .tile:focus-visible img, .tile.chosen img { outline:3px solid var(--accent); outline-offset:2px; }
  .tile small { display:block; font-size:11px; color:var(--ink3); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<header>
  <h1>Sammlungen kuratieren</h1>
  <span class="tabs" id="tabs"></span>
  <button class="btn" id="new">+ Neue Sammlung</button>
  <span class="tabs"><button id="tab-suggest" aria-current="false">Vorschläge</button></span>
  <span class="meta" id="status"></span>
</header>
<main id="main">Lade …</main>

<dialog id="create">
  <div class="dhead"><h3>Neue Sammlung</h3></div>
  <form class="dbody" method="dialog" id="create-form">
    <div class="row"><label>Titel</label><input type="text" name="title" class="grow" required></div>
    <div class="row"><label>Slug</label><input type="text" name="slug" class="grow" placeholder="aus dem Titel"></div>
    <div class="row"><label>Art</label>
      <select name="kind">
        <option value="authors">Autorinnen und Autoren</option>
        <option value="series">Verlagsreihe</option>
      </select>
    </div>
    <div class="row"><textarea name="intro" placeholder="Ein Absatz für die Seite (englisch, wie die Website)"></textarea></div>
    <div class="row"><button class="btn" value="ok">Anlegen</button><button class="btn" value="cancel" formnovalidate>Abbrechen</button><span class="error" id="create-error"></span></div>
  </form>
</dialog>

<dialog id="picker">
  <div class="dhead"><h3 id="p-title"></h3><span class="meta" id="p-meta"></span><button class="btn" id="p-close" style="margin-left:auto">Schließen (Esc)</button></div>
  <div class="dbody"><div class="pick" id="p-grid"></div></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const state = { collections: [], slug: localStorage.getItem('collections.slug') || null, candidates: {}, drag: null, view: 'edit', suggestions: null, remote: null };
const cover = (id, size = 'M') => id && id.startsWith('ol:') ? `https://covers.openlibrary.org/b/id/${id.slice(3)}-${size}.jpg` : '';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const current = () => state.collections.find(c => c.slug === state.slug);

function status(text, isError) {
  $('status').textContent = text;
  $('status').className = isError ? 'error' : 'meta';
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}

/** Every write answers with the whole collection; this swaps it in. */
function take(collection) {
  state.collections = state.collections.map(c => (c.slug === collection.slug ? collection : c));
  status(`gespeichert ${new Date().toLocaleTimeString('de')}`);
  render();
}

async function write(path, body) {
  try { take((await api(path, { slug: state.slug, ...body })).collection); }
  catch (e) { status(e.message, true); }
}

async function load() {
  const data = await api('/api/collections');
  state.collections = data.collections;
  state.remote = data.remote;
  if (!current()) state.slug = state.collections[0]?.slug ?? null;
  render();
}

function renderTabs() {
  $('tabs').innerHTML = state.collections.map(c =>
    `<button data-slug="${esc(c.slug)}" aria-current="${c.slug === state.slug && state.view !== 'suggest'}">${esc(c.title)} <small>${c.works.length}${c.published ? '' : ' · Entwurf'}</small></button>`).join('');
  for (const b of $('tabs').querySelectorAll('button')) b.onclick = () => {
    state.view = 'edit';
    state.slug = b.dataset.slug;
    localStorage.setItem('collections.slug', state.slug);
    render();
  };
}

function render() {
  renderTabs();
  $('tab-suggest').setAttribute('aria-current', String(state.view === 'suggest'));
  if (state.view === 'suggest') return renderSuggestions();
  const c = current();
  if (!c) { $('main').innerHTML = '<p>Noch keine Sammlung. Oben „+ Neue Sammlung".</p>'; return; }
  const isAuthors = c.kind === 'authors';
  const sources = isAuthors ? (c.authors || []).map(a => a.name) : (c.publishers || []);
  const inWall = new Set(c.works.map(w => w.id));

  $('main').innerHTML = `
    <section>
      <h2>Seite</h2>
      <div class="row"><label>Titel</label><input type="text" id="m-title" class="grow" value="${esc(c.title)}"></div>
      <div class="row"><textarea id="m-intro">${esc(c.intro)}</textarea></div>
      <div class="row">
        <label><input type="checkbox" id="m-pub" ${c.published ? 'checked' : ''}> veröffentlicht</label>
        <span class="note">Ein Entwurf ist nur unter <code>npm run dev</code> zu sehen; veröffentlicht erscheint er nach dem nächsten Deploy.</span>
        <a class="note" href="http://localhost:3000/collections/${esc(c.slug)}" target="_blank">Vorschau /collections/${esc(c.slug)} ↗</a>
      </div>
    </section>

    <section>
      <h2>${isAuthors ? 'Autorinnen und Autoren' : 'Verlagsschreibweisen'} (${sources.length})</h2>
      <p class="note">${isAuthors
        ? 'Nur Werke, deren <b>erste</b> Autorin auf dieser Liste steht, lassen sich hinzufügen. Wer von der Liste genommen wird, verliert auch ihre Werke auf der Wand.'
        : 'Nur Cover von Ausgaben, deren Verlagsfeld genau einer dieser Schreibweisen entspricht (Groß- und Kleinschreibung und Satzzeichen egal).'}</p>
      <div class="chips" id="chips">${isAuthors
        ? (c.authors || []).map(a => `<span class="chip">${esc(a.name)} <small>${a.keys.join(', ')}</small><button data-rm="${esc(a.name)}" title="entfernen">×</button></span>`).join('')
        : sources.map(p => `<span class="chip">${esc(p)}<button data-rm="${esc(p)}" title="entfernen">×</button></span>`).join('')}</div>
      <div class="row" style="margin-top:10px">
        <input type="text" id="s-q" class="grow" placeholder="${isAuthors ? 'Name suchen, z. B. Virginia Woolf' : 'Verlag, genau wie im Katalog, z. B. Penguin Classics'}">
        <button class="btn" id="s-go">${isAuthors ? 'Bei Open Library suchen' : 'Hinzufügen'}</button>
      </div>
      <ul class="found" id="found"></ul>
    </section>

    <section>
      <h2>Wand (${c.works.length})</h2>
      <p class="note">Ziehen sortiert um, Klick wechselt das Cover, × nimmt das Werk heraus. Die Reihenfolge hier ist die Reihenfolge auf der Seite.</p>
      <div class="wall" id="wall">${c.works.map((w, i) => `
        <div class="cell" draggable="true" data-id="${w.id}">
          <img src="${cover(w.coverId)}" alt="" loading="lazy">
          <span class="n">${i + 1}</span>
          <button class="x" data-rm="${w.id}" title="aus der Sammlung nehmen">×</button>
          <div class="t">${esc(w.title)}</div><div class="a">${esc(w.author)}</div>
        </div>`).join('')}</div>
    </section>

    <section>
      <h2>Kandidaten</h2>
      <p class="note">Die meistgedruckten Werke je ${isAuthors ? 'Autorin' : 'Verlag'} bei Open Library. Aufklappen lädt sie (einmal, danach aus dem Zwischenspeicher). Klick öffnet die Cover.</p>
      <div id="sources">${sources.map(s => `
        <details class="source" data-source="${esc(s)}" ${state.candidates[`${c.slug}|${s}`] ? 'open' : ''}>
          <summary>${esc(s)} <small>${c.works.filter(w => isAuthors && w.author === s).length || ''}</small></summary>
          <div class="cands">${candidatesHtml(c, s, inWall)}</div>
        </details>`).join('')}</div>
    </section>`;

  $('m-title').onchange = e => write('/api/meta', { title: e.target.value });
  $('m-intro').onchange = e => write('/api/meta', { intro: e.target.value });
  $('m-pub').onchange = e => write('/api/meta', { published: e.target.checked });

  for (const b of $('chips').querySelectorAll('button[data-rm]')) b.onclick = () => {
    const name = b.dataset.rm;
    const n = c.works.filter(w => w.author === name).length;
    if (!confirm(`${name} von der Liste nehmen?${isAuthors && n ? ` ${n} Werk(e) verlassen damit die Wand.` : ''}`)) return;
    write(isAuthors ? '/api/author' : '/api/publisher', { remove: name });
  };
  const go = () => isAuthors ? findAuthor() : write('/api/publisher', { name: $('s-q').value });
  $('s-go').onclick = go;
  $('s-q').onkeydown = e => { if (e.key === 'Enter') go(); };

  for (const b of $('wall').querySelectorAll('button[data-rm]')) b.onclick = e => {
    e.stopPropagation();
    write('/api/remove', { id: b.dataset.rm });
  };
  for (const cell of $('wall').querySelectorAll('.cell')) {
    const w = c.works.find(x => x.id === cell.dataset.id);
    cell.onclick = () => openPicker({ id: w.id, title: w.title, author: w.author, firstPublished: w.firstPublished }, w.coverId);
    cell.ondragstart = () => { state.drag = w.id; cell.classList.add('dragging'); };
    cell.ondragend = () => cell.classList.remove('dragging');
    cell.ondragover = e => { e.preventDefault(); cell.classList.add('over'); };
    cell.ondragleave = () => cell.classList.remove('over');
    cell.ondrop = e => {
      e.preventDefault();
      const ids = c.works.map(x => x.id).filter(id => id !== state.drag);
      ids.splice(ids.indexOf(w.id), 0, state.drag);
      write('/api/order', { ids });
    };
  }

  for (const d of $('sources').querySelectorAll('details')) {
    d.ontoggle = () => { if (d.open) loadCandidates(c, d.dataset.source, d); };
    bindCandidates(d, c);
  }
}

function candidatesHtml(c, source, inWall) {
  const list = state.candidates[`${c.slug}|${source}`];
  if (!list) return '<span class="note">…</span>';
  if (list.error) return `<span class="error">${esc(list.error)}</span>`;
  if (list.length === 0) return '<span class="note">Keine Werke gefunden, deren erste Autorin diese ist.</span>';
  return list.map((w, i) => `
    <button class="cand ${inWall.has(w.id) ? 'in' : ''}" data-i="${i}">
      ${w.coverId ? `<img src="${cover(w.coverId, 'S')}" alt="" loading="lazy">` : '<span class="none"></span>'}
      <span><b>${esc(w.title)}</b><span>${w.firstPublished ?? '?'} · ${w.editions} Ausgaben${c.kind === 'series' ? ` · ${esc(w.author)}` : ''}</span></span>
    </button>`).join('');
}

function bindCandidates(d, c) {
  const list = state.candidates[`${c.slug}|${d.dataset.source}`];
  if (!Array.isArray(list)) return;
  for (const b of d.querySelectorAll('.cand')) b.onclick = () => {
    const w = list[Number(b.dataset.i)];
    const inWall = c.works.find(x => x.id === w.id);
    openPicker(w, inWall?.coverId);
  };
}

async function loadCandidates(c, source, d) {
  const key = `${c.slug}|${source}`;
  if (state.candidates[key]) return;
  try {
    state.candidates[key] = (await api(`/api/candidates?slug=${encodeURIComponent(c.slug)}&source=${encodeURIComponent(source)}`)).candidates;
  } catch (e) {
    // A timeout is not "no works": say it failed, and let the next open try again.
    d.querySelector('.cands').innerHTML = `<span class="error">${esc(e.message)} — zuklappen und erneut öffnen versucht es noch einmal.</span>`;
    return;
  }
  d.querySelector('.cands').innerHTML = candidatesHtml(c, source, new Set(c.works.map(w => w.id)));
  bindCandidates(d, c);
}

async function findAuthor() {
  const q = $('s-q').value.trim();
  if (!q) return;
  $('found').innerHTML = '<li><span>suche …</span></li>';
  try {
    const { found } = await api(`/api/find-author?q=${encodeURIComponent(q)}`);
    $('found').innerHTML = found.length ? found.map((a, i) => `
      <li><b>${esc(a.name)}</b><span>${esc(a.key)} · ${a.works ?? 0} Werke · ${esc(a.topWork ?? '')}${a.born ? ` · geb. ${esc(a.born)}` : ''}</span>
      <button class="btn" data-i="${i}">hinzufügen</button></li>`).join('') : '<li><span>nichts gefunden</span></li>';
    for (const b of $('found').querySelectorAll('button')) b.onclick = () => {
      const a = found[Number(b.dataset.i)];
      // The name as typed wins over the catalogue's spelling when it is the same person
      // under a known name, so two keys can be one author (Reed: OL27626A and OL11412010A).
      const known = (current().authors || []).find(x => x.name.toLowerCase() === q.toLowerCase());
      write('/api/author', { name: known ? known.name : a.name, keys: [a.key] });
    };
  } catch (e) {
    $('found').innerHTML = `<li class="error">${esc(e.message)}</li>`;
  }
}

async function openPicker(work, chosen) {
  const c = current();
  $('p-title').textContent = work.title;
  $('p-meta').textContent = `${work.author} · lädt …`;
  $('p-grid').innerHTML = '';
  $('picker').showModal();
  let covers;
  try {
    covers = (await api(`/api/covers?slug=${encodeURIComponent(c.slug)}&id=${work.id}`)).covers;
  } catch (e) {
    $('p-meta').innerHTML = `<span class="error">${esc(e.message)}</span>`;
    return;
  }
  $('p-meta').textContent = `${work.author} · ${covers.length} Cover${c.kind === 'series' ? ` bei ${(c.publishers || []).join(', ')}` : ''}`;
  if (covers.length === 0) {
    $('p-grid').innerHTML = `<p class="note">${c.kind === 'series' ? 'Keine Ausgabe mit Cover unter diesen Verlagsschreibweisen.' : 'Keine Cover in den gelesenen Ausgaben.'}</p>`;
    return;
  }
  $('p-grid').innerHTML = covers.map((x, i) => `
    <button class="tile ${x.coverId === chosen ? 'chosen' : ''}" data-i="${i}">
      <img src="${cover(x.coverId)}" alt="" loading="lazy">
      <small>${esc([x.year, x.publisher].filter(Boolean).join(' · ') || 'aus dem Index')}</small>
    </button>`).join('');
  for (const b of $('p-grid').querySelectorAll('.tile')) b.onclick = async () => {
    const x = covers[Number(b.dataset.i)];
    $('picker').close();
    await write('/api/pick', { id: work.id, title: work.title, author: work.author, coverId: x.coverId, firstPublished: work.firstPublished });
  };
}
$('p-close').onclick = () => $('picker').close();

/*
  Friends' suggestions (ROADMAP 5.10a), fetched from the site that runs
  /suggest when this tab is opened — once, and again only on "Neu laden".
  "Übernehmen" puts the book with its cover on the wall through the same
  route as a pick here, so an author outside the collection's list is refused
  until Julian adds her above; then the suggestion is marked taken.
*/
$('tab-suggest').onclick = () => { state.view = 'suggest'; state.suggestions = null; render(); };

async function renderSuggestions() {
  if (!state.suggestions) {
    $('main').innerHTML = '<p class="meta">Lade Vorschläge …</p>';
    try { state.suggestions = await api('/api/suggestions'); }
    catch (e) { $('main').innerHTML = `<p class="error">${esc(e.message)}</p>`; return; }
  }
  const data = state.suggestions;
  if (data.off) {
    $('main').innerHTML = `<p>Keine Quelle für Vorschläge eingestellt. Starten mit<br><code>SUGGEST_REMOTE=https://beautifulcovers.vercel.app SUGGEST_ADMIN_PASSWORD=… npx tsx lab/collections/serve.ts</code></p>`;
    return;
  }
  const decided = data.decisions || {};
  const open = data.suggestions.filter(s => !decided[s.id]).reverse();
  const done = data.suggestions.filter(s => decided[s.id]).reverse();
  const title = s => s.collection ? (state.collections.find(c => c.slug === s.collection)?.title ?? s.collection) : `Neue Sammlung: „${esc(s.newCollection)}“`;
  const row = (s, i, isOpen) => {
    const c = state.collections.find(x => x.slug === s.collection);
    const off = c && c.kind === 'authors' && !(c.authors || []).some(a => a.name === s.work.author.normalize('NFC'));
    const inWall = c && c.works.some(w => w.id === s.work.id);
    return `<div class="cell" style="cursor:default">
      <img src="${cover(s.work.coverId)}" alt="">
      <div class="t"><b>${esc(s.work.title)}</b></div><div class="a">${esc(s.work.author)}</div>
      <div class="a">für ${title(s)} · ${esc(s.on)}${s.by ? ` · von ${esc(s.by)}` : ''}</div>
      ${s.note ? `<div class="t">„${esc(s.note)}“</div>` : ''}
      ${off ? `<div class="error" style="font-size:12px">${esc(s.work.author)} steht nicht auf der Liste</div>` : ''}
      ${inWall ? '<div class="note">schon auf der Wand — Übernehmen tauscht das Cover</div>' : ''}
      ${isOpen ? `<div class="row" style="margin-top:6px">
        ${c ? `<button class="btn" data-take="${i}" ${off ? 'disabled title="erst die Autorin oben auf die Liste setzen"' : ''}>Übernehmen</button>` : `<button class="btn" data-done="${i}">Erledigt</button>`}
        <button class="btn danger" data-decline="${i}">Ablehnen</button></div>`
        : `<div class="note">${decided[s.id] === 'taken' ? 'übernommen' : 'abgelehnt'}</div>`}
    </div>`;
  };
  $('main').innerHTML = `
    <section><h2>Offen (${open.length})</h2>
      <p class="note">Aus ${esc(state.remote || '')}, Speicher: ${esc(data.store)}. <button class="btn" id="s-reload">Neu laden</button></p>
      <div class="wall" id="s-open">${open.map((s, i) => row(s, i, true)).join('') || '<p class="note">Nichts offen.</p>'}</div>
    </section>
    <section><h2>Entschieden (${done.length})</h2><div class="wall">${done.map((s, i) => row(s, i, false)).join('')}</div></section>`;
  $('s-reload').onclick = () => { state.suggestions = null; render(); };
  const decide = async (s, decision) => {
    await api('/api/suggestions/decide', { id: s.id, decision });
    data.decisions = { ...decided, [s.id]: decision };
    render();
  };
  for (const b of $('main').querySelectorAll('[data-take]')) b.onclick = async () => {
    const s = open[Number(b.dataset.take)];
    try {
      const { collection } = await api('/api/pick', { slug: s.collection, id: s.work.id, title: s.work.title, author: s.work.author, coverId: s.work.coverId });
      state.collections = state.collections.map(c => (c.slug === collection.slug ? collection : c));
      await decide(s, 'taken');
      status(`${s.work.title} übernommen`);
    } catch (e) { status(e.message, true); }
  };
  for (const b of $('main').querySelectorAll('[data-done]')) b.onclick = () => decide(open[Number(b.dataset.done)], 'taken').catch(e => status(e.message, true));
  for (const b of $('main').querySelectorAll('[data-decline]')) b.onclick = () => decide(open[Number(b.dataset.decline)], 'declined').catch(e => status(e.message, true));
}

$('new').onclick = () => { $('create-form').reset(); $('create-error').textContent = ''; $('create').showModal(); };
$('create-form').onsubmit = async e => {
  if (e.submitter?.value !== 'ok') return;
  e.preventDefault();
  const f = new FormData(e.target);
  try {
    const { collection } = await api('/api/create', Object.fromEntries(f));
    state.collections.push(collection);
    state.slug = collection.slug;
    localStorage.setItem('collections.slug', state.slug);
    $('create').close();
    render();
  } catch (err) {
    $('create-error').textContent = err.message;
  }
};

load().catch(e => { $('main').innerHTML = `<p class="error">${esc(e.message)}</p>`; });
</script>
</body>
</html>
